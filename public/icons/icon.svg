    <linearGradient id="pwa-glow" x1="330" y1="120" x2="410" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="80" y="80" width="352" height="352" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#pwa-bg)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="white" stroke-opacity="0.12" stroke-width="4" />

  <!-- RenDesk R Icon Geometry -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="112" y="112" width="60" height="288" rx="30" fill="#FFFFFF" />
    <!-- Upper Loop -->
    <path d="M172 112H264C316 112 352 144 352 192C352 240 316 272 264 272H172V112Z" fill="url(#pwa-brand)" />
    <!-- Loop Inner Cutout -->
    <path d="M172 164H252C276 164 294 176 294 192C294 208 276 220 252 220H172V164Z" fill="#0B132B" />
    <!-- Diagonal Leg -->
    <path d="M232 250L330 384C338 395 354 397 365 388C376 378 375 362 364 350L284 250H232Z" fill="url(#pwa-brand)" />
